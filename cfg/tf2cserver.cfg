// ****************************************************************************
// Team Fortress 2 Classified
// Config - server.cfg
// Date - 26/04/2026
// ****************************************************************************

// .................................. Basic ................................. //

// hostname - Name of the server.
hostname "xinayder's den | EU #1 | Vanilla + TDM + TF30"
mapcyclefile mapcycle.txt
motdfile motd.txt
// rcon_password - Remote console password.
rcon_password ""

// sv_password - Server password for private servers.
sv_password ""

sv_logfilename_format "tf2c_%Y-%m-%dT%H-%M"

sv_downloadurl "https://fastdl.xndr.it/"
sv_allowdownload 1

// fps stuff

sv_maxrate 50000
sv_minrate 7500
sv_maxupdaterate 66
sv_minupdaterate 20
sv_maxcmdrate 66
sv_mincmdrate 30

// ............................. Server Logging ............................. //

// log - Enable server log output.
// Recommended: log on
log on

// sv_logbans - Log server bans in the server logs.
sv_logbans 1

// sv_logecho - Display log information in server console.
sv_logecho 1

// sv_logfile - Write server log information to file.
sv_logfile 1

// sv_log_onefile - Use a single rolling log file.
sv_log_onefile 0

sv_alltalk 1
tf2c_allow_special_classes 1

sv_tags "alltalk,rtv,nominate,sourcemod"

mp_timelimit 30
tf_bot_quota 32
tf_bot_quota_mode fill

sm_advertisements_enabled 1
sm_advertisements_interval 60