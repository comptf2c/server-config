// ****************************************************************************
// Team Fortress 2 Classified
// Config - server.cfg
// Date - 26/04/2026
// ****************************************************************************

// .................................. Basic ................................. //

// hostname - Name of the server.
hostname "xinayder's den | EU #2 | MGEMod"
mapcyclefile mapcycle_mge.txt
motdfile motd_mge.txt
// rcon_password - Remote console password.
rcon_password ""

// sv_password - Server password for private servers.
sv_password ""

sv_allowdownload 1
sv_downloadurl "https://fastdl.xndr.it/"

sv_logsdir "logs"
sv_logfilename_format "mge_%Y-%m-%dT%H-%M"

//sv_use_steam_networking 1

// ............................. Server Logging ............................. //

// log - Enable server log output.
// Recommended: log on
log on

// sv_logbans - Log server bans in the server logs.
sv_logbans 1

// sv_logecho - Display log information in server console.
sv_logecho 1

// sv_logfile - Write server log information to file.
sv_logfile 1

// sv_log_onefile - Use a single rolling log file.
sv_log_onefile 0

sv_alltalk 1

echo "-- Disabling MGE stats and unloading TF2DM"
sm plugins load disabled/mge.smx
mgemod_stats 0

sv_tags "alltalk,mge,mgemod"