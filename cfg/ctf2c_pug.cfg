// ****************************************************************************
// Team Fortress 2 Classified
// Config - server.cfg
// Date - 26/04/2026
// ****************************************************************************

// .................................. Basic ................................. //

// hostname - Name of the server.
hostname "CompTF2C | EU #1 | PUG"
mapcyclefile mapcycle_pug.txt
motdfile motd_pug.txt
// rcon_password - Remote console password.
rcon_password ""

// sv_password - Server password for private servers.
sv_password ""

sv_logfilename_format "pug_%Y-%m-%dT%H-%M"

sv_downloadurl "https://fastdl.xndr.it/"
sv_allowdownload 1

// fps stuff

sv_maxrate 50000
sv_minrate 7500
sv_maxupdaterate 66
sv_minupdaterate 20
sv_maxcmdrate 66
sv_mincmdrate 30

// ............................. Server Logging ............................. //

// log - Enable server log output.
// Recommended: log on
log on

// sv_logbans - Log server bans in the server logs.
sv_logbans 1

// sv_logecho - Display log information in server console.
sv_logecho 1

// sv_logfile - Write server log information to file.
sv_logfile 1

// sv_log_onefile - Use a single rolling log file.
sv_log_onefile 0

sv_tags "alltalk,rtv,nominate,sourcemod"

sm_advertisements_enabled 1
sm_advertisements_interval 60

tf_bot_quota 0
tf_bot_kick all

tv_enable 1

sm plugins unload nativevotes_funcommands
sm plugins unload nativevotes_funvotes
sm plugins unload nextmap